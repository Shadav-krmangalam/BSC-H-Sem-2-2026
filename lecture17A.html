<body>
    <script>

      async function sendProducts(){
          let response = await fetch('https://dummyjson.com/products/add', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({
    title: 'Bottle',
    brand:'Milton',
    price:1000,
    description:"This is a milton water bottle"
    /* other product data */
  })
})
  let data = await response.json()

  console.log(data)

        }

        sendProducts()


    </script>
